<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05060a">
  <meta name="robots" content="noindex">
  <title>404 — Charles Lioc</title>
  <link rel="icon" href="assets/charles-lioc-logo-locked.svg" type="image/svg+xml">
  <link rel="stylesheet" href="subpages.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center}
    .error-shell{
      width:min(calc(100% - 32px),980px);
      border:1px solid var(--line);
      background:rgba(5,9,16,.58);
      padding:clamp(30px,6vw,72px);
      position:relative;
      overflow:hidden;
    }
    .error-shell::before{
      content:"";
      position:absolute;
      width:520px;height:520px;border-radius:50%;
      border:1px dashed rgba(0,239,255,.14);
      right:-180px;top:-200px;
    }
    .error-shell::after{
      content:"";
      position:absolute;
      width:420px;height:1px;
      background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);
      right:-40px;top:150px;transform:rotate(-18deg);opacity:.45;
    }
    .error-logo{
      width:110px;height:110px;object-fit:contain;
      filter:drop-shadow(0 0 18px rgba(0,239,255,.18));
    }
    .error-code{
      margin-top:22px;color:var(--pink);
      font:400 8px "Space Mono",monospace;letter-spacing:.12em;
    }
    h1{
      margin:16px 0 18px;
      font-size:clamp(64px,13vw,150px);
      line-height:.78;
      letter-spacing:-.07em;
    }
    h1 span{color:transparent;-webkit-text-stroke:1px rgba(230,239,255,.78)}
    p{max-width:610px;color:#929caf;line-height:1.7}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
    .actions a{
      min-height:48px;padding:0 15px;border:1px solid var(--line);
      display:flex;align-items:center;gap:18px;
      font:700 8px "Space Mono",monospace;
    }
    .actions a:first-child{
      border-color:rgba(0,239,255,.35);
      background:linear-gradient(90deg,rgba(0,239,255,.06),rgba(255,43,214,.04));
    }
    .actions b{color:var(--cyan);font-size:14px}
  </style>
  <link rel="stylesheet" href="/experience.css?v=1" />
  <script src="/experience.js?v=1" defer></script>
</head>
<body>
  <main class="error-shell">
    <img class="error-logo" src="assets/charles-lioc-logo-locked.svg" alt="Charles Lioc logo">
    <div class="error-code">ERROR // ROUTE NOT FOUND</div>
    <h1>404<br><span>LOST NODE.</span></h1>
    <p>
      The page you tried to open does not exist here. The main website,
      project directory, Lab and portfolio are still online.
    </p>
    <div class="actions">
      <a href="./">RETURN HOME <b>→</b></a>
      <a href="portfolio/">OPEN PORTFOLIO <b>↗</b></a>
    </div>
  </main>
</body>
</html>
