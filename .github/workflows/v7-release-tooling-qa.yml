name: iCharles V7 Release Tooling QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/Deploy-V7-Hidden-Cloudflare.ps1"
      - "tools/Deploy-V7-Public-Cloudflare.ps1"
      - "tools/v7-release-tooling-qa.mjs"
      - "tools/v7-public-release-tooling-qa.mjs"
      - "tools/v7-inner-scenes-production-qa.mjs"
      - ".github/workflows/v7-release-tooling-qa.yml"
  push:
    branches:
      - main
    paths:
      - "tools/Deploy-V7-Hidden-Cloudflare.ps1"
      - "tools/Deploy-V7-Public-Cloudflare.ps1"
      - "tools/v7-release-tooling-qa.mjs"
      - "tools/v7-public-release-tooling-qa.mjs"
      - "tools/v7-inner-scenes-production-qa.mjs"
      - ".github/workflows/v7-release-tooling-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tooling:
    name: Guard V7 Cloudflare release tooling
    runs-on: windows-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse PowerShell release tool
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @(
            '.\tools\Deploy-V7-Hidden-Cloudflare.ps1',
            '.\tools\Deploy-V7-Public-Cloudflare.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              throw "PowerShell parser found $($errors.Count) error(s) in $script."
            }
          }

          Write-Host 'PowerShell syntax: PASS (hidden + public release tools)'

      - name: Verify release invariants
        shell: pwsh
        run: |
          node --check .\tools\v7-inner-scenes-production-qa.mjs
          node .\tools\v7-release-tooling-qa.mjs
          node .\tools\v7-public-release-tooling-qa.mjs
