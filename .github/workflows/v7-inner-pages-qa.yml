name: iCharles V7.5 Inner Worlds QA
on:
  pull_request:
    branches: [main]
    paths:
      - "portfolio/**"
      - "contact/**"
      - "services/**"
      - "about/**"
      - "projects/**"
      - "lab/**"
      - "try/**"
      - "privacy/**"
      - "assets/v7/v7-mobile-nav.*"
      - "assets/v7/v7-inner-shell.css"
      - "assets/v7/v7-page-scenes.js"
      - "tools/v7-inner-pages-qa.mjs"
      - ".github/workflows/v7-inner-pages-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: Full inner-world Microsoft Edge QA
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse shared V7.5 scripts
        shell: pwsh
        run: |
          node --check .\assets\v7\v7-mobile-nav.js
          node --check .\assets\v7\v7-page-scenes.js
          node --check .\tools\v7-inner-pages-qa.mjs
      - name: Install Playwright Core
        shell: pwsh
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run full inner-world qualification
        shell: pwsh
        run: node .\tools\v7-inner-pages-qa.mjs
      - name: Upload V7.5 inner-world evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-5-inner-worlds-evidence
          path: artifacts/v7-5-inner-worlds
          if-no-files-found: warn
