name: Build Clientbound

on:
  push:
    branches: [main]
    paths:
      - 'clientbound-src/**'
      - '.github/workflows/clientbound-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-clientbound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cost architecture
        shell: bash
        run: |
          set -euo pipefail
          forbidden_files=(firebase.json .firebaserc firebase_options.dart railway.toml Dockerfile CNAME)
          for name in "${forbidden_files[@]}"; do
            if find clientbound-src -type f -name "$name" -print -quit | grep -q .; then
              echo "Forbidden infrastructure file detected: $name"
              exit 1
            fi
          done
          if grep -n -E '^[[:space:]]*(firebase_core|firebase_auth|cloud_firestore|cloud_functions|stripe):' clientbound-src/pubspec.yaml; then
            echo "Forbidden paid/cloud package dependency detected"
            exit 1
          fi
          if grep -R -I -n -E "package:(firebase_|cloud_firestore|cloud_functions|stripe)" clientbound-src/lib; then
            echo "Forbidden paid/cloud package import detected"
            exit 1
          fi
          if grep -R -I -n -E 'clientbound\.co' clientbound-src/web; then
            echo "Paid custom-domain dependency detected"
            exit 1
          fi
          echo "ZERO_COST_GUARD=PASS"

      - name: Install Flutter stable
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b 3.47.5 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Validate Clientbound
        working-directory: clientbound-src
        run: |
          flutter pub get
          dart format --output=none lib test
          flutter analyze
          flutter test

      - name: Build and verify Clientbound Web
        working-directory: clientbound-src
        run: |
          flutter build web --release --base-href /clientbound/
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          test -f build/web/404.html
          grep -q '/clientbound/' build/web/index.html
          grep -q 'Clientbound' build/web/manifest.json
          echo "WEB_RELEASE_GATE=PASS"

      - name: Build and verify Clientbound Android arm64
        run: |
          set -euo pipefail
          rm -rf /tmp/clientbound-android
          cp -R clientbound-src /tmp/clientbound-android
          cd /tmp/clientbound-android
          rm -rf build .dart_tool android
          flutter create . --platforms android --org com.icharles --project-name clientbound
          sed -i 's/android:label="clientbound"/android:label="Clientbound"/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/clientbound_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
            <path
                android:fillColor="#07111F"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="@android:color/transparent"
                android:strokeColor="#6EA8FE"
                android:strokeWidth="10"
                android:strokeLineCap="round"
                android:pathData="M70,27 C61,21 49,20 39,24 C24,30 17,46 20,61 C23,77 38,88 54,87 C61,87 67,85 72,82"/>
            <path
                android:fillColor="@android:color/transparent"
                android:strokeColor="#50D890"
                android:strokeWidth="7"
                android:strokeLineCap="round"
                android:strokeLineJoin="round"
                android:pathData="M52,54 L88,54 M88,54 L76,42 M88,54 L76,66"/>
          </vector>
          XML
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/clientbound_launcher"#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee /tmp/clientbound-apk-badging.txt
          grep -q "package: name='com.icharles.clientbound'" /tmp/clientbound-apk-badging.txt
          grep -q "application-label:'Clientbound'" /tmp/clientbound-apk-badging.txt
          echo "ANDROID_RELEASE_GATE=PASS"

      - name: Publish Clientbound Web to GitHub Pages tree
        run: |
          rm -rf clientbound
          mkdir -p clientbound
          cp -R clientbound-src/build/web/. clientbound/
          touch clientbound/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clientbound
          if git diff --cached --quiet; then
            echo "Clientbound web output unchanged"
          else
            git commit -m "build: publish Clientbound web [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            git push
          fi

      - name: Publish Android APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^version:/{print $2}' clientbound-src/pubspec.yaml)"
          SEMVER="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          TAG="clientbound-v${SEMVER}"
          APK_NAME="Clientbound-v${SEMVER}-build${BUILD}-arm64.apk"
          SHA_NAME="${APK_NAME}.sha256.txt"
          cp /tmp/clientbound-android/build/app/outputs/flutter-apk/app-release.apk "/tmp/${APK_NAME}"
          cd /tmp
          sha256sum "${APK_NAME}" > "${SHA_NAME}"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_NAME}" "${SHA_NAME}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "${TAG}" "${APK_NAME}" "${SHA_NAME}"               --repo "${{ github.repository }}"               --title "Clientbound v${SEMVER}"               --notes "Zero-cost Clientbound Web + Android release ${VERSION}. Validated with zero-cost guard, Flutter format/analyze/tests, PWA asset checks, and Android package/label verification. Direct-install APK; not a Play Store signed release."
          fi
